<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>bevy_gekko · Live multi-view inference</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101b29;color:#eef4fa;font:16px system-ui,sans-serif;overflow:hidden}#bevy{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;padding:30px;max-width:750px;margin:auto;gap:18px;pointer-events:none}h1{font-size:42px;margin:0}p{line-height:1.6;margin:0}a{color:#7de1ca;pointer-events:auto}#message{color:#b7c8dc}#error{color:#ffb29b;white-space:pre-wrap}button{padding:12px 22px;border-radius:8px;border:0;background:#7de1ca;color:#102822;cursor:pointer;pointer-events:auto;font:inherit}
</style></head><body>
<canvas id="bevy" tabindex="0" aria-label="Interactive Zeroverse scene, camera controls and Gekko inference annotations"></canvas>
<div id="loading"><h1>bevy_gekko</h1><p>A live Zeroverse scene, three cameras, and a multi-view model running on your device.</p><p id="message">Checking WebGPU…</p><p id="error"></p><p><a href="../project/">Project and paper</a> · <a href="https://github.com/mosure/burn_gekko/tree/main/crates/bevy_gekko">Source and native build</a></p></div>
<script type="module">
const message=document.querySelector('#message'), error=document.querySelector('#error');
try {
  if(!navigator.gpu) throw new Error('This demo needs WebGPU. Use a current WebGPU-enabled browser on HTTPS, or run the native app.');
  if(!await navigator.gpu.requestAdapter()) throw new Error('No WebGPU adapter is available. Try a supported browser or the native app.');
  message.textContent='Loading the scene viewer… The trained model downloads only when you request it.';
  const {default:init}=await import('./viewer/bevy_gekko.js');
  await init();
  const interval=setInterval(()=>{if(window.gekkoDemo){document.querySelector('#loading').remove();document.querySelector('#bevy').focus();clearInterval(interval);}},200);
} catch(e) { error.textContent=String(e);message.textContent='Viewer could not start.'; }
</script></body></html>
