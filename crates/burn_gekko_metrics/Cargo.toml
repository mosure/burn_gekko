[package]
name = "burn_gekko_metrics"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Portable camera and reconstruction metrics shared by Burn Gekko evaluation and demos"
repository = "https://github.com/mosure/burn_gekko"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-*"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
