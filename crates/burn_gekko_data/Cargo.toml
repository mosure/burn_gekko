[package]
name = "burn_gekko_data"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Procedural multi-view dataset contracts, geometry and immutable disk caches"
repository = "https://github.com/mosure/burn_gekko"
homepage = "https://github.com/mosure/burn_gekko"
readme = "README.md"
keywords = ["burn", "vision", "multi-view", "deep-learning"]
categories = ["science", "computer-vision"]
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sha2 = "0.10"
safetensors = "0.7"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
