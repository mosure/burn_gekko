[package]
name = "burn_vjepa"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "V-JEPA 2.1 vision encoders, sparse tokens and audited checkpoint loading in Burn"
repository = "https://github.com/mosure/burn_gekko"
homepage = "https://github.com/mosure/burn_gekko"
readme = "README.md"
keywords = ["burn", "vision", "multi-view", "deep-learning"]
categories = ["science", "computer-vision"]
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE-*", "/UPSTREAM.*", "/LOCAL_MODIFICATIONS.toml", "/VJEPA21_WEIGHTS_LICENSE", "/Cargo.toml"]

[features]
default = ["ndarray"]
ndarray = ["burn/ndarray"]
cuda = ["burn/cuda", "burn/fusion", "burn-store/cuda"]
wgpu = ["burn/wgpu", "burn/fusion", "burn-store/wgpu"]
wasm-fusion = ["burn/fusion"]
sparse-patchify-cuda = ["cuda", "dep:burn-backend", "dep:burn-fusion", "dep:burn-ir", "dep:burn_flex_gmm", "burn_flex_gmm/cuda-kernel"]
sparse-patchify-wgpu = ["wgpu", "dep:burn-backend", "dep:burn-fusion", "dep:burn-ir", "dep:burn_flex_gmm", "burn_flex_gmm/wgpu-kernel"]

[dependencies]
anyhow = "1"
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
burn-store = { version = "=0.21.0", default-features = false, features = ["std", "burnpack", "pytorch", "safetensors"] }
burn-backend = { version = "=0.21.0", optional = true }
burn-fusion = { version = "=0.21.0", optional = true }
burn-ir = { version = "=0.21.0", optional = true }
burn_flex_gmm = { version = "=0.21.2", default-features = false, optional = true }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "checkpoint"
required-features = ["ndarray"]
