[package]
name = "burn_gekko_eval"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Native metrics, camera protocols and single-checkpoint benchmark scoring"
repository = "https://github.com/mosure/burn_gekko"
homepage = "https://github.com/mosure/burn_gekko"
readme = "README.md"
keywords = ["burn", "vision", "multi-view", "deep-learning"]
categories = ["science", "computer-vision"]
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[dependencies]
burn_gekko_metrics = { version = "0.1.0", path = "../burn_gekko_metrics" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
burn_gekko_data = { version = "0.1.1", path = "../burn_gekko_data" }
clap = { version = "4.5", features = ["derive"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
nalgebra = { version = "0.34.2", default-features = false, features = ["std"] }
vision-geometry = "=0.9.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gekko-eval"
path = "src/main.rs"
