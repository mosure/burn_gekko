[package]
name = "burn_gekko_inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Checkpoint-verified, asynchronous native and WebGPU inference for Burn Gekko"
repository = "https://github.com/mosure/burn_gekko"
readme = "README.md"
include = ["/src/**", "/tests/**", "/examples/**", "/Cargo.toml", "/README.md", "/LICENSE-*"]

[features]
default = []
ndarray = ["burn/ndarray", "burn_gekko/ndarray"]
wgpu = ["burn/wgpu", "burn_gekko/wgpu"]
web = ["wgpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
anyhow = "1"
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
burn_gekko = { version = "0.1.0", path = "../..", default-features = false }
burn_vjepa = { version = "0.1.0", path = "../burn_vjepa", default-features = false }
burn_gekko_metrics = { version = "0.1.0", path = "../burn_gekko_metrics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[[bin]]
name = "gekko-demo-export"
path = "src/bin/export.rs"
required-features = ["ndarray"]

[[example]]
name = "check_bundle"
required-features = ["ndarray"]
