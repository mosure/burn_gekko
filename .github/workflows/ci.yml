name: Rust workspace
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cpu
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 tools/interop/verify_encoder_import.py
      # Preserve the audited encoder import byte-for-byte; its local wrappers are linted below.
      - run: cargo fmt -p burn_gekko -p burn_gekko_data -p burn_gekko_train -p burn_gekko_eval -p burn_gekko_report -p burn_gekko_metrics -p burn_gekko_inference --check
      - run: rustfmt --edition 2024 --check crates/burn_vjepa/src/provenance.rs
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p burn_gekko_inference --features ndarray --locked
      - name: Validate project page and paper
        run: cargo run --locked -p burn_gekko_report --bin gekko-report -- validate --bundle www/project
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
      # Cache registry inputs only: generated package workspaces confuse target pruning.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ runner.os }}-registry-${{ hashFiles('Cargo.lock') }}
      - run: cargo publish --workspace --locked --dry-run
  cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cuda
      - run: cargo clippy -p burn_gekko_train --all-targets --features cuda --locked -- -D warnings
      - run: cargo check --workspace --all-features --locked
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/zeroverse_capture
          shared-key: capture
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: cargo fmt --manifest-path tools/zeroverse_capture/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/zeroverse_capture/Cargo.toml --all-targets --locked -- -D warnings
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/bevy_gekko -> target
          shared-key: demo-check
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: cargo fmt --manifest-path crates/bevy_gekko/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/bevy_gekko/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path crates/bevy_gekko/Cargo.toml --locked
      - run: cargo check --locked -p burn_gekko_inference --lib --target wasm32-unknown-unknown --no-default-features --features web
      - run: cargo clippy --manifest-path crates/bevy_gekko/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features web --locked -- -D warnings
