findings = ["The previous small decoder produced smooth room-colored predictions with weak cross-view utility. Weight loading, patch layout, sparse masking, numerical parity, geometry alignment and tiny-set overfit checks had already passed. Those checks did not establish held-out reconstruction competence.", "Explicit reference transport was tried and rejected: it retained gradient energy but placed structures incorrectly (four-room edge cosine about 0.025). A released Gekko probe then supplied a positive control: strong structural recovery, but its target-statistic display was oracle-only and could not qualify as a deployable output.", "With user approval, the Burn pipeline now combines frozen released Gekko appearance features and frozen V-JEPA 2.1, a trainable semantic/RGB residual adapter, and predicted RGB patch statistics. Official-implementation parity and hidden-pixel interventions validate the imported appearance model. Training and inference run in Rust/Burn; Python provides reference checks and analysis.", "A 3,000-step, 128-room adapter/calibration stage was followed by 3,000 steps on all 512 training rooms, adapting only the last two decoder blocks. A final 1,500-step stage added a small training-only gradient-energy term. Each stage uses new AdamW state; it is a weight fine-tune, not an optimizer resume.", "Full validation selected the final contrast-preserving checkpoint: RGB MSE 0.001341, edge cosine 0.534, edge-energy ratio 0.845 and interior-only ratio 0.824 across 96 targets. The MSE-oriented checkpoint scored 0.001214, 0.588 and 0.351 respectively. The selected model trades about 10% RGB error for greater contrast; this decision was frozen before fresh capture and test.", "Co-visibility is measured from the same adapted checkpoint, with a separate dense-target forward. Validation AUROC is 0.734 versus 0.778 for the unadapted released model. Reconstruction adaptation therefore improves this project’s RGB behavior while sacrificing some inherited RI ranking performance. The study does not attribute the gain uniquely to V-JEPA."]
limitations = ["The accepted scope, if all gates pass, is correction of severe reconstruction collapse on held-out procedural rooms from this generator. Fine textures, thin structures, patch brightness seams, disocclusion and some misplaced objects remain imperfect. The worst-case panel is intentionally included. This is not photorealistic, exact or real-world reconstruction qualification.", "The inherited Gekko checkpoint contains a much larger external appearance/reconstruction prior than the previous scratch decoder. Before/after results are an engineering comparison, not a matched-pretraining-compute test. This study bundles the extra encoder, released decoder, calibration, adapter and selective fine-tuning.", "The adapter consumes both V-JEPA semantics and observed RGB. Disabling it removes both. No isolated semantic benefit, sparse-reference speedup, joint set-attention gain, geometry recovery, calibrated co-visibility probability or real-image transfer has been demonstrated.", "One training seed, one 256px resolution and one fixed evaluation mask. The 64 fresh rooms share procedural layout/material families with training, despite disjoint seeds. Confidence intervals resample rooms and do not capture training-seed uncertainty. The extra 1/16 train/validation rooms in the fresh cache were unused.", "The final RI head is inherited and not directly retrained by this adaptation loss. Its ranking is qualified only as a synthetic-room diagnostic. Geometry labels are reserved for evaluation; RGB is the only reconstruction supervision. The RGB and dense RI APIs have separate information access.", "A paper can currently claim a validated Burn port and reproducible bounded transfer study with standalone RGB calibration and honest failure analysis. A methods claim needs separate appearance-only, semantic-only, adapter, loss and reference-set ablations; multiple seeds; sparse cost/quality curves; and external real-data evaluation. Preserve the pretrained weights’ CC-BY-NC-SA-4.0 terms."]

