[[protocols]]
name = "tum-freiburg3-calibrated-pose"
implemented = true
source = "https://cvg.cit.tum.de/data/datasets/rgbd-dataset"
input_size = 256
original_size = [640, 480]
pairs = 186
sequences = 3
proposed_pairs = 192
association_exclusions = 6
translation_baseline_exclusions = 1
model_input = "RGB-only 256px; camera intrinsics enter the CPU solver after inference, ground-truth poses enter scoring only"
readout = "Fixed reciprocal local 3x3 centroid and mutual hard-match mask for fusion, same-image and block-6 encoder controls"
solver = "Native normalized eight-point essential RANSAC, 3 original-pixel Sampson threshold, deterministic maximum 2048 trials, signed cheirality"
metrics = ["rotation and signed translation-direction degrees", "failure-inclusive pose AUC5/10/20 and recall", "per-sequence errors and solver success"]
aggregation = "Equal pairs within sequence, then equal sequences"
evaluation_use = "First frozen Pilot10 evaluation was locally independent; any later use is development; encoder-pretraining overlap unknown"
qualification_status = "Pilot10 improves macro pose recall but fails the all-sequence AUC10 gate against its same-image control"
selection_record = ".data/pilot-10/selection.toml"
score_artifact = ".data/pilot-10/pose-score.json"
published_number_comparability = false
reason = "Small registered cohort in one environment; not official five-point pose or SLAM protocol"

