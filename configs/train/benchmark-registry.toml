readout = "16px patch grid; cosine NN and reciprocal head/layer-mean cross-attention"
metrics = ["visible-query EPE", "PCK8/16/32", "mutual coverage", "mutual EPE", "grid oracle"]
baseline = "Fixed original V-JEPA teacher; same-position predictor"
published_number_comparability = false

[[protocols]]
name = "hpatches-240-local-readout"
