batch_size = 1
cache_full_views = false
fixed_example = false
train_rooms = 12
eval_every = 4
profile_phases = true
max_seconds = 600

[training]
seed = 17
steps = 8
learning_rate = 0.0001
weight_decay = 0.05
mask_ratio = 0.75
references = 2
decoder_width = 64
decoder_depth = 2
decoder_heads = 4
normalize_targets = true
global_grad_clip = 1.0

[training.encoder]
kind = "burnpack"
directory = ".data/models/vjepa2_1_base"
