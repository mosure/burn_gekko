batch_size = 8
cache_full_views = true
fixed_example = false
train_rooms = 4
eval_every = 64
profile_phases = true
max_seconds = 600
shuffle_samples = true

[training]
seed = 29
steps = 64
learning_rate = 0.0001
weight_decay = 0.05
mask_ratio = 0.75
references = 2
decoder_width = 256
decoder_depth = 4
decoder_heads = 8
normalize_targets = true
global_grad_clip = 1.0

[training.encoder]
kind = "burnpack"
directory = ".data/models/vjepa2_1_base"
