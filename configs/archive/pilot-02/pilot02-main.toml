batch_size = 8
cache_full_views = true
fixed_example = false
train_rooms = 2048
eval_every = 2000
profile_phases = false
max_seconds = 5428
shuffle_samples = true

[schedule]
warmup_steps = 1000
decay_steps = 65000
min_lr_ratio = 0.05

[training]
seed = 29
steps = 65000
learning_rate = 0.0003
weight_decay = 0.05
mask_ratio = 0.75
references = 2
decoder_width = 256
decoder_depth = 4
decoder_heads = 8
normalize_targets = true
global_grad_clip = 1.0

[training.encoder]
kind = "burnpack"
directory = ".data/models/vjepa2_1_base"
