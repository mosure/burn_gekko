description = "One completed 4096-update training run on 8192 procedural rooms. This candidate failed the registered synthetic retention checks and is retained only as a diagnostic. The report shows latent completion, spatial detail, actual-view matching and calibrated camera recovery for this checkpoint. These are synthetic development measurements, not independent evidence of SotA or resolved RGB blur."
architecture = "MIT V-JEPA 2.1 Base image encoder, sparse target and two reference views, six fusion blocks of width 384 with six attention heads, 2D rotary positions and a block-6 spatial descriptor bounded to 25% residual magnitude. All 151 encoder tensors train from the first update. Images are 256 by 256, target masking is 90%, batch size is 16, seed is 853, and the fixed horizon is 4096 updates with 128 warmup updates. Trunk learning rate is 2e-5 and encoder learning rate is 4e-7. This phase begins from own Pilot 13 geometry weights and resets both AdamW optimizers. The original MIT V-JEPA supplies frozen latent targets; an own frozen Pilot 11 encoder supplies final-feature preservation at weight 4. Latent completion, relative-improvement and image-warp equivariance losses are retained. An actual-view bidirectional correspondence NLL uses renderer labels with weight 0.1 and temperature 0.07. Camera and depth labels supervise training only; encoder and fusion inference inputs are RGB."
limitations = ["One final foundation endpoint is reported. The registered internal selection decision is documented separately; this page does not compare separately trained private model versions. Passing synthetic retention is not independent deployment or SotA qualification.", "Completion uses 64 reused validation rooms and 192 targets; geometric matching and calibrated pose use the first 32 of those rooms. All three readouts and all eight fixed solver seeds are retained. No model performance on the reserved test split is used here.", "Feature colors visualize teacher and predicted latent space with one common teacher-fitted projection. They are not RGB reconstructions. Feature signal/error in dB is not pixel PSNR. No RGB decoder or learned calibration head is trained or evaluated for this new checkpoint.", "The camera table uses known intrinsics in a calibrated eight-point solver after RGB-only correspondence inference. It reports angles and pose AUC, not predicted intrinsic accuracy. Translation direction keeps its sign; scale is not evaluated.", "Higher feature variance alone does not demonstrate correct detail. The native detail diagnostic measures centered spatial agreement and adjacent differences, with explicit teacher-assisted amplitude oracles labeled as diagnostics.", "Training data are the immutable historical Zeroverse 0.25.0 / adapter 0.8.0 cache. The newer live renderer does not alter this cache. Full-pixel camera/depth integrity passed on all rooms; that is not learned camera accuracy.", "Efficiency values describe this entire GPU training command, including startup, validation and the authorized shared desktop load. They are not process-attributed energy, kernel occupancy or profiled timing.", "No noncommercial pretrained weights or teachers enter this training lineage. Independent real-view transfer, matched public baselines, additional training seeds, reliable camera calibration and sharp RGB completion remain unqualified."]

