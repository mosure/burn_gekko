schema = 1
id = "pilot07-route-balanced-continue"
title = "burn_gekko: Sparse-View Latent Completion in Burn"
author = "Mitchell Mosure"
description = "A shared multi-view fusion model predicts missing V-JEPA 2.1 representations from sparse target observations and independent reference views."
architecture = "V-JEPA 2.1 Base (12 blocks, width 768, 16-pixel patches), with final and block-6 features feeding six fusion blocks of width 384 and six attention heads. The shared latent head predicts 768 channels per image-grid token. A separate full-target relative-improvement head is trained from reconstruction-error differences."
run = ".data/runs/pilot-07-fusion-route-balanced-continue"
checkpoint = ".data/runs/pilot-07-fusion-route-balanced-continue/final"
checkpoint_sha256 = "61ecd81f7d9c4094ff1fa120e761176301db14e4a22e056cc966bf8616a81bf6"
sample_count = 6
limitations = ["One training seed and a synthetic indoor training distribution; no broad foundation-model or SOTA qualification.", "Latent prediction suppresses high-frequency appearance and is not a trained RGB reconstruction capability. The earlier RGB blur problem is not claimed resolved.", "ETH3D uses local hard-patch matching, not the published refinement pipeline. HPatches was used as development evidence.", "The fusion readouts still trail stronger intermediate-encoder controls on real viewpoint changes.", "Camera estimation and depth heads are not trained for this checkpoint. Image-grid RoPE is not calibrated camera/spatial encoding.", "Strict 1e-5 reference-permutation invariance fails in float32. Hidden-target isolation passes.", "GPU power includes shared desktop activity; board energy is not a per-process attribution."]

